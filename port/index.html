<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>Brooklyn Simmons — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kaushan+Script&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a12;--card:#0b0f1a;--card2:#0e1320;--line:rgba(255,255,255,.09);--red:#e3174c;--red2:#ff2d62;--mut:#9aa3b5;--txt:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#04060b;color:var(--txt);font-family:Inter,'Noto Sans Myanmar',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
svg{display:block;flex:none}
.app{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg);overflow-x:hidden}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;background:radial-gradient(110% 80% at 100% 0%,rgba(227,23,76,.6),rgba(227,23,76,.14) 45%,transparent 72%),linear-gradient(180deg,#0a0d18,transparent);pointer-events:none}
.view{position:relative;padding:calc(env(safe-area-inset-top) + 26px) 16px 128px}
[contenteditable]{outline:1px dashed rgba(255,45,98,.7);outline-offset:2px;border-radius:4px;min-width:12px;display:inline-block}
[contenteditable]:focus{outline:2px solid var(--red2);background:rgba(255,255,255,.05)}

/* ---------- HOME ---------- */
.hero{display:flex;gap:16px;align-items:flex-start;position:relative}
.swoosh{position:absolute;right:-150px;top:70px;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(227,23,76,.35),rgba(227,23,76,.06) 70%);border:1px solid rgba(227,23,76,.25);pointer-events:none}
.swoosh i{position:absolute;left:36px;top:92px;border-left:34px solid rgba(227,23,76,.8);border-top:22px solid transparent;border-bottom:22px solid transparent;border-radius:6px}
.avatar{width:94px;height:94px;border-radius:50%;padding:3px;border:3px solid var(--red);position:relative;flex:none;cursor:pointer;box-shadow:0 0 22px rgba(227,23,76,.35)}
.avatar img,.avatar .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2a2f45,#12162a);display:grid;place-items:center;font-weight:800;font-size:28px;color:#fff}
.avatar .dot{position:absolute;right:2px;bottom:6px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.hinfo{flex:1;min-width:0;position:relative;z-index:1}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hinfo h1{font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.2px}
.handle{color:var(--mut);font-size:15px;margin-top:6px;font-weight:500}
.role{margin-top:12px;font-size:14.5px;font-weight:500;display:flex;gap:6px;align-items:center}
.tagl{margin-top:8px;color:var(--mut);font-size:14px}
.cbtn{background:var(--red);border-radius:999px;padding:11px 16px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 8px 22px rgba(227,23,76,.4);flex:none;margin-top:2px}
.stats{margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:20px;background:rgba(10,14,24,.75);backdrop-filter:blur(6px);padding:16px 4px 14px}
.stat{text-align:center;padding:0 4px;color:var(--red2);display:flex;flex-direction:column;align-items:center;gap:6px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{color:#fff;font-size:17px;font-weight:700;line-height:1.15}
.stat small{color:var(--mut);font-size:11.5px;line-height:1.2}
.tabs{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:18px;background:rgba(10,14,24,.75);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);height:54px}
.tabs button{display:grid;place-items:center;color:#fff;position:relative;opacity:.9}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on::after{content:"";position:absolute;bottom:-1px;left:18%;right:18%;height:3px;border-radius:3px;background:var(--red)}
.grid{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:.73;border-radius:16px;overflow:hidden;background:#111;cursor:pointer;border:1px solid var(--line)}
.tile video,.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.tile .meta{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.pbadge{width:25px;height:25px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.tbtns{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:4px}
.tbtns button{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}
.addtile{aspect-ratio:.73;border-radius:16px;border:2px dashed rgba(255,45,98,.6);display:grid;place-items:center;color:var(--red2);font-size:12px;font-weight:600;text-align:center;gap:6px;align-content:center}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;font-size:14px}

/* ---------- NAV ---------- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);width:min(398px,calc(100vw - 32px));z-index:50;display:grid;grid-template-columns:repeat(3,1fr);height:74px;border-radius:999px;background:linear-gradient(180deg,rgba(40,10,24,.92),rgba(12,8,18,.96));border:1px solid rgba(227,23,76,.35);box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px)}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:500;color:#fff;position:relative}
#nav button+button{border-left:1px solid var(--line);}
#nav button.on{color:var(--red2)}
#nav button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:3px;border-radius:3px;background:var(--red);box-shadow:0 0 14px var(--red)}

/* ---------- PRICING ---------- */
.p-hero{position:relative;min-height:156px}
.hero-art{position:absolute;right:-16px;top:-26px;width:250px;height:160px;opacity:.95;pointer-events:none}
.back{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;position:relative;z-index:2}
.p-hero h1{font-size:34px;font-weight:700;margin-top:30px;letter-spacing:-.5px;position:relative}
.p-hero p{color:#c3c9d6;font-size:14.5px;line-height:1.55;margin-top:6px;position:relative}
.seg{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;background:rgba(14,18,30,.9);border:1px solid var(--line);border-radius:999px;padding:3px;height:56px}
.seg button{border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:16px;color:#fff}
.seg button.on{background:linear-gradient(180deg,#f0215a,#d81446);box-shadow:0 8px 24px rgba(227,23,76,.4)}
.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.sec-h{display:flex;gap:14px;align-items:center;position:relative;min-height:84px}
.sec-h .ico{color:var(--red2);flex:none}
.sec-h h2{font-size:21px;font-weight:700}
.sec-h p{color:#b6bdcc;font-size:13.5px;line-height:1.45;margin-top:5px;max-width:200px}
.script{font-family:'Kaushan Script',cursive;color:var(--red2);position:absolute;right:0;top:4px;font-size:21px;line-height:1.05;transform:rotate(-8deg);text-align:left;width:120px}
.script::after{content:"";display:block;height:3px;border-radius:3px;background:var(--red2);width:110px;margin-top:6px;transform:rotate(-4deg);opacity:.9}
.plans{display:flex;gap:14px;margin:14px -16px 0;padding:22px 16px 26px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-padding:0 16px;align-items:stretch}
.plans::-webkit-scrollbar{display:none}
.dots{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:.2s}
.dots i.on{background:var(--red2);width:22px;border-radius:99px}
.plan{position:relative;display:flex;flex-direction:column;flex:0 0 82%;scroll-snap-align:center;border:1px solid var(--line);border-radius:20px;background:rgba(12,16,28,.9);padding:26px 22px 22px;min-width:0}
.plan.pop{border-color:var(--red2);box-shadow:0 0 0 1px rgba(255,45,98,.35),0 0 28px rgba(227,23,76,.35);background:linear-gradient(180deg,rgba(60,10,28,.55),rgba(12,16,28,.95))}
.badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--red);font-style:normal;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.plan h3{font-size:22px;font-weight:700}
.pd{color:#aab2c3;font-size:14px;line-height:1.5;margin-top:8px}
.price{margin:18px 0 18px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.price b{color:var(--red2);font-size:42px;font-weight:700;letter-spacing:-.5px}
.price small{color:#aab2c3;font-size:14px}
.plan ul{flex:1;display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
.plan li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;color:#e7eaf2;position:relative}
.plan li svg{margin-top:0px}
.gs{width:100%;height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.gs.solid{background:var(--red);border-color:var(--red);box-shadow:0 6px 18px rgba(227,23,76,.45)}
.note{margin-top:18px;display:flex;gap:8px;color:#aab2c3;font-size:12px;line-height:1.5}
.ptools{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.mini{font-size:10px;padding:4px 7px;border-radius:8px;border:1px dashed rgba(255,45,98,.7);color:var(--red2)}
.xdel{color:var(--red2);font-size:12px;margin-left:2px}

/* ---------- CV ---------- */
.cv-top{position:relative;min-height:150px}
.cv-top h1{font-size:34px;font-weight:700;margin-top:26px;letter-spacing:-.5px}
.cv-top h2{font-size:21px;font-weight:600;color:#8d8bff;margin-top:2px;background:linear-gradient(90deg,#8d9bff,#c4a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cv-top p{color:#c3c9d6;font-size:14.5px;line-height:1.45;margin-top:8px;max-width:260px}
.cv-top .script{top:10px;right:0;font-size:23px;width:150px;transform:rotate(-10deg)}
.pcard{display:flex;gap:16px;align-items:center;margin-top:8px;padding-top:6px}
.pcard .avatar{width:100px;height:100px;cursor:default}
.pinfo h3{font-size:22px;font-weight:700}
.pinfo .handle{margin-top:4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;font-size:12px;gap:10px 10px;position:relative}
.pgrid div{display:flex;gap:6px;align-items:center;color:#e8ebf3;min-width:0}
.pgrid div span{word-break:break-all}
.pgrid svg{color:var(--red2)}
.box{margin-top:14px;border:1px solid var(--line);border-radius:18px;background:rgba(10,14,24,.8);padding:16px 16px}
.bh{display:flex;gap:12px;align-items:center;color:var(--red2);margin-bottom:16px}
.bh h4{color:#fff;font-size:21px;font-weight:700}
.box .abt{color:#c8cedb;font-size:14.5px;line-height:1.7;padding-left:2px;margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;font-weight:500;background:rgba(255,255,255,.02)}
.sb{width:30px;height:30px;border-radius:8px;border:1.5px solid;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(0,0,0,.35)}
.tl{padding-left:28px;position:relative;margin-top:0;padding-top:4px}
.tl::before{content:"";position:absolute;left:5px;top:18px;bottom:12px;width:2px;background:var(--red)}
.ex{position:relative;margin-bottom:24px;padding-top:0}
.ex:last-child{margin-bottom:0}
.ex::before{content:"";position:absolute;left:-28px;margin-left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(227,23,76,.25)}
.ex small{display:block;color:#c3c9d6;font-size:13.5px}
.ex b{display:block;font-size:16.5px;font-weight:600;margin:6px 0 4px;line-height:1.35}
.ex span.d{color:#8d8bff;font-size:13.5px;opacity:.9;line-height:1.5;display:block}
.hl{display:grid;grid-template-columns:repeat(4,1fr);margin-top:6px}
.cv-sp{height:20px}

/* ---------- SHEETS / OVERLAYS ---------- */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.ov.open{display:flex}
.sheet{width:min(430px,100%);margin-bottom:calc(env(safe-area-inset-bottom) + 16px);width:min(398px,calc(100vw - 32px));border:1.5px solid rgba(227,23,76,.7);border-radius:26px;background:linear-gradient(180deg,#120a14,#090b14);padding:14px 16px 18px;box-shadow:0 0 40px rgba(227,23,76,.25);position:relative;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.handlebar{width:44px;height:4px;border-radius:4px;background:var(--red);margin:0 auto 14px}
.sh{display:flex;gap:14px;align-items:center}
.sh .ci{width:48px;height:48px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.sh h3{font-size:23px;font-weight:700}
.sh p{color:#b8bfcd;font-size:13.5px;margin-top:3px}
.xbtn{position:absolute;right:16px;top:30px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.cc{display:flex;align-items:center;gap:10px;border-radius:16px;padding:14px 10px;border:1px solid;text-align:left;text-decoration:none;color:#fff}
.cc .l{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.cc b{display:block;font-size:15px;font-weight:600}
.cc small{display:block;color:#aeb6c6;font-size:10.5px;margin-top:3px;line-height:1.2}
.cc .ch{margin-left:auto;color:#cfd4df}
.c-tg{border-color:rgba(34,158,217,.5);background:rgba(34,158,217,.1)}
.c-vb{border-color:rgba(115,96,242,.55);background:rgba(115,96,242,.12)}
.c-ph{border-color:rgba(32,185,95,.5);background:rgba(32,185,95,.1)}
.c-gm{border-color:rgba(227,23,76,.55);background:rgba(227,23,76,.12)}

/* ---------- REELS ---------- */
#reels{position:fixed;inset:0;z-index:90;display:none;background:#000}
#reels.open{display:block}
.rwrap{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:#000;overflow:hidden}
.rs{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.rs::-webkit-scrollbar{display:none}
.reel{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.reel video,.reel .ph{width:100%;height:100%;object-fit:cover;display:block}
.reel video.land{object-fit:contain;background:#000}
.reel .ph{display:grid;place-items:center;color:#fff;font-weight:600;opacity:.9}
.rtitle{position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 28px);font-size:25px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.5);z-index:5;pointer-events:none}
.rback{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 24px);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;z-index:6;backdrop-filter:blur(6px)}
.rmute{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 70px);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:6}
.rbar{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 28px);height:5px;border-radius:5px;background:rgba(255,255,255,.65);z-index:6;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:#dc2a41;border-radius:5px}
.rplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;z-index:5;pointer-events:none;backdrop-filter:blur(6px);transition:opacity .15s}
.rplay.hide{opacity:0}

/* ---------- ADMIN ---------- */
#admin{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:70;display:none;gap:6px;background:rgba(10,12,20,.96);border:1px solid var(--red);border-radius:999px;padding:5px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.6);flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px)}
#admin.show{display:flex}
#admin button{padding:7px 11px;border-radius:999px;font-weight:600;background:rgba(255,255,255,.08)}
#admin button.on{background:var(--red)}
.mod{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
.mod.open{display:flex}
.mbox{width:min(400px,100%);max-height:90dvh;overflow:auto;background:#10131f;border:1px solid var(--red);border-radius:20px;padding:20px}
.mbox h3{font-size:19px;margin-bottom:14px}
.mbox label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.mbox input,.mbox select{width:100%;background:#080a12;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:#fff;font:inherit;font-size:14px}
.mbox input:focus,.mbox select:focus{outline:1px solid var(--red2)}
.mbox .hint{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.mrow{display:flex;gap:10px;margin-top:18px}
.mrow button{flex:1;padding:12px;border-radius:12px;font-weight:600;background:rgba(255,255,255,.1)}
.mrow button.pri{background:var(--red)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1b1f2e;border:1px solid var(--red);padding:10px 16px;border-radius:12px;font-size:13px;z-index:200;display:none;max-width:calc(100vw - 32px);text-align:center}
@media(min-width:431px){body{background:radial-gradient(circle at 50% 0,#12162a,#04060b 70%)}.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---------- APPLY / TERMS POPUPS ---------- */
.apov{position:fixed;inset:0;z-index:130;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
.apov.open{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.appanel{position:relative;width:min(400px,100%);max-height:94dvh;overflow:auto;border:1.5px solid rgba(227,23,76,.6);border-radius:28px;background:linear-gradient(180deg,#160b15,#0a0c15);padding:26px 20px 20px;box-shadow:0 0 50px rgba(227,23,76,.25);animation:up .28s ease;scrollbar-width:none}
.appanel::-webkit-scrollbar{display:none}
.apx{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;z-index:2}
.appanel h2{font-size:27px;font-weight:800;letter-spacing:-.4px;padding-right:44px;line-height:1.15}
.appanel .sub{color:var(--mut);font-size:14px;line-height:1.5;margin-top:8px}
.applan{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px;padding:14px 16px;border-radius:18px;border:1px solid rgba(227,23,76,.5);background:linear-gradient(135deg,rgba(227,23,76,.22),rgba(227,23,76,.07))}
.applan b{display:block;font-size:18px;font-weight:700}
.applan small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.apprice{color:var(--red2);font-weight:800;font-size:20px;white-space:nowrap;text-align:right}
.apprice small{color:var(--mut);font-weight:500;font-size:12px;margin:0}
.fld{display:block;margin-top:14px;min-width:0}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:7px}
.fld input{width:100%;height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);padding:0 14px;font:inherit;font-size:15px;outline:0;transition:.15s}
.fld input::placeholder{color:rgba(154,163,181,.55)}
.fld input:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(255,45,98,.22)}
.fld input.bad{border-color:#ff5252;box-shadow:0 0 0 3px rgba(255,82,82,.2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.aperr{margin-top:14px;padding:10px 14px;border-radius:12px;background:rgba(255,82,82,.12);border:1px solid rgba(255,82,82,.45);color:#ff9a9a;font-size:13px;line-height:1.5}
.aperr a{color:inherit;text-decoration:underline}
.apsubmit{width:100%;height:54px;margin-top:20px;border-radius:999px;background:linear-gradient(180deg,#f0215a,#d81446);border:1px solid rgba(255,255,255,.12);font-size:16px;font-weight:700;color:#fff;box-shadow:0 10px 28px rgba(227,23,76,.45)}
.apsubmit:active{transform:scale(.98)}
.apagree{margin-top:12px;text-align:center;font-size:12px;color:var(--mut);line-height:1.5}
.aplink{color:var(--red2);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.apstate{text-align:center;padding:14px 0 4px}
.apstate h2{padding:0;margin-top:6px}
.apbar{height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin:26px 0 14px}
.apbar i{display:block;height:100%;width:6%;border-radius:7px;background:linear-gradient(90deg,var(--red),#ff6b8e);transition:width .25s}
.apcheck{width:76px;height:76px;margin:6px auto 14px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 30px rgba(227,23,76,.55);animation:pop .4s ease}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.apid{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 14px;border-radius:12px;border:1px dashed rgba(255,45,98,.6);font-size:13px;color:var(--mut)}
.apid b{color:var(--txt);letter-spacing:.5px}
.apid button{color:var(--red2);font-size:16px}
.apnote{margin-top:16px;color:var(--mut);font-size:13.5px;line-height:1.6}
.apacts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.apbtn2{display:flex;align-items:center;justify-content:center;height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-weight:600;font-size:15px;color:var(--txt);text-decoration:none}
.tcitem{display:flex;gap:12px;margin-top:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14.5px;line-height:1.55}
.tcn{color:var(--red2);font-weight:700;white-space:nowrap}
.tclink{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;color:var(--mut);font-size:13px}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800);}
function save(){ if(!ADMIN) return; try{localStorage.setItem('pf_data',JSON.stringify(D));}catch(e){toast('Storage full — Export လုပ်ထားပါ');} }

/* ---------- IndexedDB for owner-uploaded videos (owner's browser only) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('pf_videos',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(blob){const db=await idb();const id='idb:'+Date.now()+Math.random().toString(36).slice(2,6);await new Promise((res,rej)=>{const t=db.transaction('v','readwrite');t.objectStore('v').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});return id;}
async function idbGet(id){const db=await idb();return new Promise((res)=>{const r=db.transaction('v').objectStore('v').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}
async function resolveVideos(){
  for(const v of D.videos){
    if(v.src&&v.src.startsWith('idb:')&&!blobUrls[v.src]){
      try{const b=await idbGet(v.src);if(b)blobUrls[v.src]=URL.createObjectURL(b);}catch(e){}
    }
  }
}
const vsrc = v => !v.src ? '' : v.src.startsWith('idb:') ? (blobUrls[v.src]||'') : v.src;

function thumb(v){
  const s = vsrc(v);
  return s ? `<video muted playsinline preload="metadata" src="${esc(s)}#t=0.3"></video>` : `<div class="ph" style="background:${grad(v.hue||200)}"></div>`;
}
function vHome(){
  const p = D.profile;

  let list = D.videos.map((v,i)=>({v,i}));
  const curKind = homeTab==='reels' ? 'reel' : 'motion';
  list = list.filter(x=>(x.v.kind||'motion')===curKind);
  const tiles = list.map(({v,i})=>`
    <div class="tile" data-act="play" data-a="${i}">
      ${thumb(v)}
      ${EDIT?`<div class="tbtns">
        <button data-act="editvid" data-a="${i}" title="Edit">${ic('edit',14)}</button>
        <button data-act="delvid" data-a="${i}" title="Delete">${ic('x',14)}</button></div>`:''}
      <div class="meta"><span class="pbadge">${ic('play',12)}</span><span>${esc(v.views)}</span></div>
    </div>`).join('');
  const add = EDIT ? `<button class="addtile" data-act="addvid">${ic('plus',26)}<span>Add video</span></button>` : '';
  const emptyMsg = !list.length && !EDIT ? `<div class="empty">No videos yet.</div>` : '';
  return `<div class="view">
    <div class="swoosh"><i></i></div>
    <div class="hero">
      <div class="avatar" data-act="avatar">${av}<i class="dot"></i></div>
      <div class="hinfo">
        <div class="hrow">
          <div style="min-width:0"><h1>${E('profile.name')}</h1><div class="handle">${E('profile.handle')}</div></div>
          <button class="cbtn" data-act="contact">${ic('chat',18)}Contact</button>
        </div>
        <div class="role">🔥 ${E('profile.role')}</div>
        <div class="tagl">${E('profile.tagline')}</div>
      </div>
    </div>
    <div class="stats">${D.stats.map((s,i)=>`<div class="stat">${ic(s.icon==='clapper'?'done':s.icon,30)}<b>${E('stats.'+i+'.value')}</b><small>${E('stats.'+i+'.label')}</small></div>`).join('')}</div>
    <div class="tabs">
      <button class="${homeTab==='motion'?'on':''}" data-act="htab" data-a="motion">${ic('mvideo',28)}</button>
      <button class="${homeTab==='reels'?'on':''}" data-act="htab" data-a="reels">${ic('reel',28)}</button>
    </div>
    <div class="grid">${tiles}${add}${emptyMsg}</div>
  </div>`;
}

let curVid=null, rObs=null;
function openReels(i){
  const el=$('#reels');
  const kd=(D.videos[i].kind||'motion');
  const pos=D.videos.map((v,k)=>k).filter(k=>(D.videos[k].kind||'motion')===kd);
  el.innerHTML = `<div class="rwrap"><div class="rs">${pos.map(k=>[D.videos[k],k]).map(([v,k])=>{
    const s=vsrc(v);
    return `<div class="reel" data-k="${k}">${s?`<video loop playsinline ${muted?'muted':''} preload="auto" src="${esc(s)}"></video>`:`<div class="ph" style="background:${grad(v.hue||200)}">${EDIT||ADMIN?'Video မထည့်ရသေးပါ — Edit mode မှာ ထည့်ပါ':''}</div>`}</div>`;}).join('')}</div>
    <div class="rtitle">${kd==='reel'?'Reels':'Motion'}</div>
    <button class="rback" data-act="closereels">${ic('chev',26)}</button>
    <button class="rmute" data-act="mute">${ic(muted?'mute':'sound',22)}</button>
    <div class="rbar"><i id="rfill"></i></div>
    <div class="rplay" id="rplay">${ic('play',30)}</div></div>`;
  el.classList.add('open'); document.body.style.overflow='hidden';
  el.querySelectorAll('.reel video').forEach(v=>{
    const f=()=>v.classList.toggle('land', v.videoWidth>v.videoHeight);
    v.addEventListener('loadedmetadata',f); if(v.readyState>=1) f();
  });
  const sc=el.querySelector('.rs'); sc.scrollTop = pos.indexOf(i)*sc.clientHeight;
  rObs && rObs.disconnect();
  rObs = new IntersectionObserver(es=>{
    es.forEach(en=>{
      const v=en.target.querySelector('video'); if(!v) return;
      if(en.isIntersecting && en.intersectionRatio>.6){
        if(curVid && curVid!==v) curVid.pause();
        curVid=v; v.muted=muted; v.currentTime=0;
        v.play().then(()=>$('#rplay').classList.add('hide')).catch(()=>$('#rplay').classList.remove('hide'));
        v.ontimeupdate=()=>{ if(v.duration) $('#rfill').style.width=(v.currentTime/v.duration*100)+'%'; };
      } else { v.pause(); }
    });
  },{root:sc,threshold:[.6,.7]});
  el.querySelectorAll('.reel').forEach(r=>rObs.observe(r));
}
function closeReels(){
  rObs&&rObs.disconnect(); curVid=null;
  $('#reels').querySelectorAll('video').forEach(v=>v.pause());
  $('#reels').classList.remove('open'); $('#reels').innerHTML=''; document.body.style.overflow='';
}

function ghLoad(){ try{ return JSON.parse(localStorage.getItem('pf_gh')||'{}'); }catch(e){ return {}; } }
function ghGuess(){
  const h=location.hostname, seg=location.pathname.split('/').filter(Boolean);
  if(h.endsWith('.github.io')){
    const isProject = seg[0] && !/\.html?$/i.test(seg[0]);
    const repo = isProject ? seg[0] : h;
    const rest = isProject ? seg.slice(1) : seg.slice(0);
    if(rest.length && /\.[a-z0-9]+$/i.test(rest[rest.length-1])) rest.pop();
    return {owner:h.split('.')[0], repo, dir:rest.join('/')};
  }
  return {owner:'',repo:'',dir:''};
}

  localStorage.setItem('pf_gh',JSON.stringify(g)); closeModal(); toast('GitHub setup သိမ်းပြီး ✓');

async function ghReq(g,path,opt={}){
  const put = opt.method==='PUT';
  const r = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`+(put?'':`?ref=${encodeURIComponent(g.branch)}`),{
    method: put?'PUT':'GET',
    headers: Object.assign({'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'}, put?{'Content-Type':'application/json'}:{}),
    body: put?JSON.stringify(opt.body):undefined
  });
  if(r.status===404 && !put) return null;
  if(!r.ok){ let m=''; try{ m=(await r.json()).message; }catch(e){} throw new Error(r.status+' '+m); }
  return r.json();
}

          toast(`Video ${i+1}/${D.videos.length} တင်နေပါတယ်… ခဏစောင့်ပါ`);
          const b=await idbGet(v.src);
          if(!b) throw new Error('ဒီ video က ဒီ browser ထဲမှာ မရှိတော့ပါ — ပြန်ရွေးပြီး Save လုပ်ပါ');
          if(b.size>95*1024*1024) throw new Error('Video က 95MB ထက်ကြီးနေတယ် — compress လုပ်ပါ (သို့) URL နဲ့ထည့်ပါ');
          const ext=({'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'})[b.type]||'mp4';
          const path=`videos/${Date.now()}-${i}.${ext}`;
          await ghReq(g,ghPath(g,path),{method:'PUT',body:{message:'Add video',content:await blobB64(b),branch:g.branch}});
          v.remote=path; save();
        }
        out.videos[i].src=v.remote;
      }
      delete out.videos[i].remote;
    }
    toast('data.json တင်နေပါတယ်…');
    const cur=await ghReq(g,ghPath(g,'data.json'));
    await ghReq(g,ghPath(g,'data.json'),{method:'PUT',body:Object.assign({message:'Update data.json',content:await blobB64(new Blob([JSON.stringify(out,null,2)])),branch:g.branch},cur?{sha:cur.sha}:{})});
    save();
    toast('Publish ပြီးပါပြီ ✓ — Site ပေါ်ရောက်ဖို့ ၁-၂ မိနစ်လောက်စောင့်ပါ');
  }catch(e){
    const m=String(e.message||e);
    alert('Publish မအောင်မြင်ပါ\n\n'+m+(/^(401|403)/.test(m)?'\n\nToken မမှန်ဘူး (သို့) Contents: Read and write permission မပေးထားဘူး ဖြစ်နိုင်ပါတယ်။':'')+(/^404/.test(m)?'\n\nUsername / Repo name / Branch ကို ပြန်စစ်ပါ။':''));
  }finally{ pubBusy=false; }
}

function validateApply(){
  const v = { name:$('#apName').value.trim(), phone:$('#apPhone').value.trim(), viber:$('#apViber').value.trim(), telegram:$('#apTg').value.trim(), email:$('#apMail').value.trim() };
  const bad=[];
  if(v.name.length<2) bad.push('apName');
  if(!/^\+?[\d\s\-()]{6,}$/.test(v.phone)) bad.push('apPhone');
  if(v.viber.length<3) bad.push('apViber');
  if(v.telegram.length<2) bad.push('apTg');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) bad.push('apMail');
  ['apName','apPhone','apViber','apTg','apMail'].forEach(id=>$('#'+id).classList.toggle('bad',bad.includes(id)));
  if(bad.length){ $('#'+bad[0]).focus(); apErr('Please fill in every field — name, phone, Viber, Telegram and a valid Gmail are all required.'); return null; }
  $('#apErr').hidden=true; return v;
}
function makeOrderId(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0'), ch='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const r=crypto.getRandomValues(new Uint8Array(4));
  return `BS-${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}-`+Array.from(r,b=>ch[b%ch.length]).join('');
}
async function sendTelegram(o){
  const h = v => String(v ?? '').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const price = o.amount==null ? h(o.priceText) : `$${o.amount}  —  first payment: $${o.firstPayment}`;
  const text = [
    `🆕 <b>New application</b>  <code>${h(o.id)}</code>`, ``,
    `📦 <b>Service:</b> ${h(o.category)}`,
    `🎁 <b>Pack:</b> ${h(o.plan)}`,
    `💰 <b>Price:</b> ${price}`,
    `📝 <b>Includes:</b> ${h(o.detail)}`, ``,
    `👤 <b>Name:</b> ${h(o.name)}`,
    `📞 <b>Phone:</b> ${h(o.phone)}`,
    `💬 <b>Viber:</b> ${h(o.viber)}`,
    `✈️ <b>Telegram:</b> ${h(o.telegram)}`,
    `✉️ <b>Gmail:</b> ${h(o.email)}`
  ].join('\n');
  const r = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
    method:'POST',
    body:new URLSearchParams({chat_id:TELEGRAM_CHAT_ID,text,parse_mode:'HTML',disable_web_page_preview:'true'})
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || !j.ok) throw new Error('Telegram: '+(j.description||r.status));
}
async function submitApply(e){
  e.preventDefault();
  if(apBusy || !apCtx) return;
  const v = validateApply(); if(!v) return;
  const S = D.pricing[apCtx.catKey], p = S.plans[apCtx.idx], n = planPrice(p);
  const order = { id:makeOrderId(), category:S.title, plan:p.name, amount:n, firstPayment:n!=null?Math.round(n*FIRST_PAYMENT_PERCENT/100):null,
    priceText:`${p.price}${p.unit||''}`, detail:p.features.slice(0,3).join(', '), ...v };
  if($('#apWeb').value){ apDone(order); return; }   // honeypot
  apBusy = true;
  const box = $('#apov .appanel');
  box.innerHTML = `<div class="apstate"><h2>Sending your application</h2><div class="apbar"><i id="apFill"></i></div><p class="sub">Please keep this window open.</p></div>`;
  let w=6; clearInterval(apTimer);
  apTimer = setInterval(()=>{ w += (90-w)*.08; const f=$('#apFill'); if(f) f.style.width=w.toFixed(1)+'%'; }, 180);
  try{
    await Promise.all([sendTelegram(order), sleep(1200)]);
    clearInterval(apTimer); const f=$('#apFill'); if(f) f.style.width='100%'; await sleep(500);
    apBusy=false; apDone(order);
  }catch(err){
    console.error(err); clearInterval(apTimer); apBusy=false;
    $('#apov').innerHTML = apFormHTML(apCtx);
    $('#apForm').addEventListener('submit', submitApply);
    ['apName','apPhone','apViber','apTg','apMail'].forEach(id=>{ $('#'+id).value = {apName:v.name,apPhone:v.phone,apViber:v.viber,apTg:v.telegram,apMail:v.email}[id]; });
    apErr(`We couldn’t send your application. Please try again, or message me directly on <a href="${contactLinks().tg}" target="_blank" rel="noopener">Telegram</a>.`);
  }
}

/* ---------- event delegation ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');
  if(!t) { if(e.target.id==='contactOv') closeContact(); if(e.target.id==='apov') closeApply(); if(e.target.id==='tcov') closeTerms(); if(e.target.closest('.reel')&&curVid){ if(curVid.paused){curVid.play();$('#rplay').classList.add('hide');}else{curVid.pause();$('#rplay').classList.remove('hide');} } return; }
  const a=t.dataset.a, b=t.dataset.b, act=t.dataset.act;
  if(['play'].includes(act) && EDIT && e.target.closest('.tbtns')) return;
  switch(act){
    case 'nav': view=a; if(EDIT||true) await render(false); window.scrollTo(0,0); break;
    case 'htab': homeTab=a; render(); break;
    case 'ptab': { const ch = pTab!==a; pTab=a; if(ch){ const y=window.scrollY; await render(false); window.scrollTo(0,y);} break; }
    case 'contact': openContact(); break;
    case 'apply': openApply(+a); break;
    case 'closeapply': closeApply(); break;
    case 'terms': openTerms(); break;
    case 'closeterms': closeTerms(); break;
    case 'copyid': { const id=$('#apIdTxt').textContent; try{ await navigator.clipboard.writeText(id); toast('Copied ✓'); }catch(_){ toast(id); } break; }
    case 'closecontact': closeContact(); break;
    case 'play': openReels(+a); break;
    case 'closereels': closeReels(); break;
    case 'mute': muted=!muted; $('#reels').querySelectorAll('video').forEach(v=>v.muted=muted); t.innerHTML=ic(muted?'mute':'sound',22); break;
    case 'avatar':
      if(EDIT) $('#avatarIn').click();
      else if(!ADMIN){ avTaps++; clearTimeout(avTimer); avTimer=setTimeout(()=>avTaps=0,2500); if(avTaps>=5){avTaps=0;tryUnlock();} }
      else $('#avatarIn').click();
      break;
    case 'toggleedit': EDIT=!EDIT; render(); break;
    case 'lock': ADMIN=false; EDIT=false; localStorage.removeItem('pf_admin'); location.reload(); break;
    case 'export': exportData(); break;
    case 'publish': publishSite(); break;
    case 'ghsetup': ghModal(); break;
    case 'saveghsetup': ghSave(); break;
    case 'import': $('#importIn').click(); break;
    case 'contactinfo': contactModal(); break;
    case 'savecontact': document.querySelectorAll('[data-ci]').forEach(i=>D.contact[i.dataset.ci]=i.value.trim()); save(); closeModal(); render(); break;
    case 'closemodal': closeModal(); break;
    case 'addvid': videoModal(null); break;
    case 'editvid': e.stopPropagation(); videoModal(+a); break;
    case 'savevideo': saveVideo(a); break;
    case 'delvid': e.stopPropagation(); if(confirm('ဒီ video ကို ဖျက်မလား?')){D.videos.splice(+a,1);save();render();} break;
    case 'addfeat': D.pricing[pTab].plans[+a].features.push('New feature'); save(); render(); break;
    case 'delfeat': D.pricing[pTab].plans[+a].features.splice(+b,1); save(); render(); break;
    case 'pop': { const pl=D.pricing[pTab].plans; const was=pl[+a].popular; pl.forEach(p=>p.popular=false); pl[+a].popular=!was; save(); render(); break; }
    case 'addskill': D.cv.skills.push({name:'New skill',badge:'Nw',color:'#ff2d62'}); save(); render(); break;
    case 'delskill': D.cv.skills.splice(+a,1); save(); render(); break;
    case 'addexp': D.cv.exp.unshift({years:'2024 – Present',title:'Job title',desc:'What you did'}); save(); render(); break;
    case 'delexp': D.cv.exp.splice(+a,1); save(); render(); break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target, p=el.dataset&&el.dataset.p;
  if(p && el.isContentEditable){ setp(p, el.textContent); save(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.isContentEditable && !e.target.dataset.multi){ e.preventDefault(); e.target.blur(); }
  if(e.key==='Escape'){ closeTerms(); closeApply(); closeContact(); closeModal(); if($('#reels').classList.contains('open')) closeReels(); }
});

/* ---------- boot ---------- */
(async function boot(){
  ADMIN = localStorage.getItem('pf_admin')==='1';
  let loaded=false;
  if(ADMIN){
    try{ const s=localStorage.getItem('pf_data'); if(s){ D=Object.assign({},DEFAULT,JSON.parse(s)); loaded=true; } }catch(e){}
  }
  if(!loaded){
    try{ const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'}); if(r.ok){ D=Object.assign({},DEFAULT,await r.json()); } }catch(e){}
  }
  await render(false);
  if(location.hash==='#admin' && !ADMIN) tryUnlock();
})();
